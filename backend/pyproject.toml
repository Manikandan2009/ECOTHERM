[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ecotherm-api"
version = "0.1.0"
description = "File-backed urban heat intelligence API and data acquisition clients"
requires-python = ">=3.12"
dependencies = [
  "earthengine-api>=1.6,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "python-dotenv>=1.1,<2",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
geospatial = [
  "geopandas>=1.0,<2",
  "numpy>=2,<3",
  "pandas>=2.2,<4",
  "pyogrio>=0.11,<1",
  "rasterio>=1.4,<2",
]
ml = [
  "scikit-learn>=1.6,<2",
]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "respx>=0.22,<1",
]

[project.scripts]
ecotherm = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
