services:
  - type: web
    name: ecotherm-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install ".[geospatial,ml]"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ECOTHERM_CORS_ORIGINS
        value: '["http://localhost:5173","http://127.0.0.1:5173","https://ecotherm-dashboard.onrender.com"]'
  - type: web
    name: ecotherm-dashboard
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://ecotherm-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
